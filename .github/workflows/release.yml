name: Release binaries

# Push a tag like v1.2.0 to build single-file binaries (Playwright stays
# external) and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Build
      run: |
        bun run build:darwin-arm64
        bun run build:linux-x64
    - name: Smoke-test linux-x64 outside the repo
      run: |
        mkdir -p "$RUNNER_TEMP/bin-smoke" && cd "$RUNNER_TEMP/bin-smoke"
        "$GITHUB_WORKSPACE/dist/lookacrawler-linux-x64" --version
        "$GITHUB_WORKSPACE/dist/lookacrawler-linux-x64" extract https://example.com | grep -q "documentation examples"
    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cd dist
        sha256sum lookacrawler-darwin-arm64 lookacrawler-linux-x64 > SHA256SUMS
        gh release create "$GITHUB_REF_NAME" lookacrawler-darwin-arm64 lookacrawler-linux-x64 SHA256SUMS --generate-notes
